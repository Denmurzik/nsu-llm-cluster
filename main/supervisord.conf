; Запускается из entrypoint.sh в фоне (nodaemon) до exec k3s: stdout контейнера остаётся
; доступен дочерним процессам через /dev/fd/1.
[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/llm/supervisord.pid
user=root

; supervisorctl (restore из копии: backup/pg-restore.sh останавливает и запускает портал) говорит с supervisord через сокет только для root
[unix_http_server]
file=/run/llm/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/llm/supervisor.sock

; Логи всех программ идут в stdout контейнера, а его ротирует Docker (run-main: --log-opt max-size=50m, max-file=5).
; Файлов логов у supervisord, Caddy и портала нет, поэтому ротировать нечего.
[program:caddy]
command=/usr/bin/caddy run --config /run/llm/Caddyfile --adapter caddyfile
environment=XDG_DATA_HOME="/var/lib/llm/caddy-data",XDG_CONFIG_HOME="/var/lib/llm/caddy-config"
autostart=true
autorestart=true
startsecs=3
startretries=100000
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:portal]
; API портала: PORTAL_WORKERS процессов uvicorn (по умолчанию 4), контроллеры в них выключены.
; Окружение портала лежит в /run/llm/portal.env (значения в кавычках bash, см. entrypoint.sh).
command=/bin/bash -c 'set -a; . /run/llm/portal.env; set +a; exec /opt/llm/portal/.venv/bin/uvicorn app.main:create_app --factory --host 127.0.0.1 --port 8000 --workers "${PORTAL_WORKERS:-4}"'
directory=/opt/llm/portal
environment=PYTHONUNBUFFERED="1",CONTROLLERS_ENABLED="false"
autostart=true
autorestart=true
startsecs=5
startretries=100000
stopwaitsecs=15
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:portal-controllers]
; Контроллеры рабочих нагрузок и бэкендов LiteLLM: ровно один процесс на установку.
command=/bin/bash -c 'set -a; . /run/llm/portal.env; set +a; exec /opt/llm/portal/.venv/bin/python -m app.controllers'
directory=/opt/llm/portal
environment=PYTHONUNBUFFERED="1"
autostart=true
autorestart=true
startsecs=5
startretries=100000
stopwaitsecs=15
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true
